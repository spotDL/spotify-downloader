# SpotDL Production Docker Compose
# Full setup with PostgreSQL, Redis, and Nginx
#
# Usage with pre-built images:
#   IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d
#
# Usage building locally:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-spotdl/spotify-downloader}-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://spotdl:${DB_PASSWORD:-spotdl}@db:5432/spotdl
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?Secret key is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://spotdl.example.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
      - web

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-spotdl/spotify-downloader}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-spotdl/spotify-downloader}-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_HOST=api
      - API_PORT=8000
      - FRONTEND_HOST=frontend
      - FRONTEND_PORT=80
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=spotdl
      - POSTGRES_PASSWORD=${DB_PASSWORD:-spotdl}
      - POSTGRES_DB=spotdl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotdl"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
