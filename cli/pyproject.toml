[project]
name = "spotdl-cli"
version = "5.0.0"
description = "SpotDL CLI - Interactive TUI for downloading music"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "xnetcat", email = "xnetcat@outlook.com" }]
keywords = ["spotify", "youtube", "music", "download", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # Core shared library (providers, matching, types)
    "spotdl-core",
    # TUI framework
    "textual>=0.89.0",
    "rich>=13.9.0",
    # CLI framework
    "typer>=0.12.0",
    # Download
    "yt-dlp>=2024.12.0",
    # Metadata embedding
    "mutagen>=1.47.0",
    # Async file operations
    "aiofiles>=24.1.0",
    # Configuration
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "platformdirs>=4.3.0",
    # SoundCloud OAuth (CLI-only feature)
    "soundcloudpy>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "textual-dev>=1.7.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-aiofiles>=24.1.0",
]

[project.scripts]
spotdl = "spotdl_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/spotDL/spotify-downloader"
Documentation = "https://spotdl.github.io/spotify-downloader"
Repository = "https://github.com/spotDL/spotify-downloader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
spotdl-core = { path = "../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/spotdl_cli"]
branch = true
omit = [
    "src/spotdl_cli/screens/*",
    "src/spotdl_cli/app.py",
    "src/spotdl_cli/__main__.py",
]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "mutagen.*",
    "soundcloudpy.*",
    "spotdl_core.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
