[project]
name = "spotdl-core"
version = "5.0.0"
description = "SpotDL Core - Shared providers, matching, and types"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "xnetcat", email = "xnetcat@outlook.com" }]
keywords = ["spotify", "youtube", "music", "download", "providers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # HTTP client
    "httpx>=0.28.0",
    # Matching
    "rapidfuzz>=3.10.0",
    "python-slugify>=8.0.4",
    "pykakasi>=2.3.0",
    # Spotify
    "spotipy>=2.24.0",
    # YouTube Music
    "ytmusicapi>=1.8.0",
    # MusicBrainz
    "musicbrainzngs>=0.7.1",
    # Discogs
    "python3-discogs-client>=2.8",
    # HTML parsing (for Apple Music, etc.)
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # Utilities
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/spotDL/spotify-downloader"
Documentation = "https://spotdl.github.io/spotify-downloader"
Repository = "https://github.com/spotDL/spotify-downloader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/spotdl_core"]
branch = true

[tool.coverage.report]
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "spotipy.*",
    "pykakasi.*",
    "slugify.*",
    "ytmusicapi.*",
    "musicbrainzngs.*",
    "discogs_client.*",
    "bs4.*",
    "lxml.*",
]
ignore_missing_imports = true
