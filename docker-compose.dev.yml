# SpotDL Development Docker Compose with Hot Reload
# Usage: docker compose -f docker-compose.dev.yml up
#
# Features:
# - Backend: Hot reload on code changes (uvicorn --reload)
# - Frontend: Vite dev server with HMR (Hot Module Replacement)
# - Source code mounted as volumes for live updates

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/spotdl.db
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      # Spotify credentials (get from https://developer.spotify.com/dashboard)
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - spotdl_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # For Vite proxy (server-side, inside Docker network)
      - VITE_API_URL=http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  spotdl_data:
