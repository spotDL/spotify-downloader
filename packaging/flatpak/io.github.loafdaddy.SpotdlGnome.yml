id: io.github.loafdaddy.SpotdlGnome
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: spotdl-gui

finish-args:
  # Downloading requires reaching Spotify, YouTube, lyrics providers, etc.
  - --share=network
  # GUI display.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Save downloaded music (default output is the user's Music folder).
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  # spotDL stores its config/cache under ~/.config/spotdl (via Path.home()).
  # Persist that directory so GUI settings survive between runs.
  - --persist=.config

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # Bundled static FFmpeg binary (the converter spotDL shells out to).
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - install -Dm755 ffmpeg /app/bin/ffmpeg
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/eugeneware/ffmpeg-static/releases/download/b4.4/linux-x64
        sha256: f406a5eb9cd03ed776fb215096dc52a1a401798b75ab72627ae82f367c9e714e
        dest-filename: ffmpeg
      - type: file
        only-arches: [aarch64]
        url: https://github.com/eugeneware/ffmpeg-static/releases/download/b4.4/linux-arm64
        sha256: 1d339661c6c5b8a4a728f731a66203211832fd7f49bcd4768ea2dd54ad4499f6
        dest-filename: ffmpeg

  # Bundled Deno binary (used by yt-dlp for some YouTube videos).
  - name: deno
    buildsystem: simple
    build-commands:
      - install -Dm755 deno /app/bin/deno
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/denoland/deno/releases/download/v2.9.3/deno-x86_64-unknown-linux-gnu.zip
        sha256: 8101865641cbede56f08ad19c0a67a87df84bce127fee0d3e3e1f7467717ffa6
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/denoland/deno/releases/download/v2.9.3/deno-aarch64-unknown-linux-gnu.zip
        sha256: 753937db98a4b56cbbbd26e8f00eb4b789191a229afec93f74bcfa4e79bc2c8b
        strip-components: 0

  # spotDL itself plus all its Python dependencies.
  #
  # NOTE: this module fetches Python wheels from PyPI at build time, so the
  # build needs network access (granted below). This is convenient for local
  # builds but is NOT allowed on Flathub. To publish on Flathub, replace this
  # module with a pinned, offline `python3-modules.json` generated by
  # flatpak-pip-generator (see README.md).
  - name: spotdl
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # --ignore-installed forces every dependency to be bundled into /app.
      # Some pure-Python deps (e.g. pygments) ship in the SDK but NOT in the
      # Platform runtime, so without this they would be missing at runtime.
      - pip3 install --prefix=${FLATPAK_DEST} --no-cache-dir --ignore-installed .
      - install -Dm644 packaging/flatpak/io.github.loafdaddy.SpotdlGnome.desktop
        ${FLATPAK_DEST}/share/applications/io.github.loafdaddy.SpotdlGnome.desktop
      - install -Dm644 packaging/flatpak/io.github.loafdaddy.SpotdlGnome.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.loafdaddy.SpotdlGnome.metainfo.xml
      - install -Dm644
        packaging/flatpak/icons/hicolor/scalable/apps/io.github.loafdaddy.SpotdlGnome.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.loafdaddy.SpotdlGnome.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build-dir
          - .flatpak-builder
          - .venv
          - dist
