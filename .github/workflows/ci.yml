name: CI

on:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spotdl
          POSTGRES_PASSWORD: spotdl
          POSTGRES_DB: spotdl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SPOTDL_TEST_POSTGRES_URL: postgresql+asyncpg://spotdl:spotdl@localhost:5432/spotdl_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages
      # ffmpeg is a binary, not a pip dep: install it so convert/tag tests run
      # (rather than auto-skip) in CI. Local dev without ffmpeg still passes.
      # Installed via apt (present on ubuntu-latest) instead of a marketplace
      # action that fetches release binaries over the network — that fetch is
      # unreliable on the Node 24 runner and was failing with "fetch failed".
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      # Version single-source guard (Plan 11 / CONTRACT H): fail if the three
      # published packages' [project].version, __version__, and cross-package == pins
      # ever drift. Keep this before the heavier mypy/pytest steps so a version skew
      # fails fast.
      - run: uv run python scripts/bump_version.py --check
      - run: uv run mypy packages/core/src apps/server/src apps/cli/src
      # Golden-corpus structural pre-check (cheap, offline): validates every case
      # file before the accuracy gate runs inside pytest below.
      - run: uv run python -m scripts.corpus.validate "packages/core/tests/matching/corpus/*.json"
      # Focused, labeled run for log visibility: prints the per-matcher-version
      # accuracy report (spec §11) so CI logs show it even when the gate is green.
      - run: uv run pytest packages/core/tests/matching/test_corpus.py -v -s
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.10.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web run type-check
      - run: pnpm -C apps/web run test

  # Self-host smoke: build the image and boot the self-host compose stack, then
  # assert the app is healthy and exports metrics. Kept as a SEPARATE job so it
  # never gates the `python`/`web` jobs (spec: fast feedback stays independent of
  # the slower image build).
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the image locally under the same tag the compose file pulls, so
      # `docker compose up` uses this build instead of reaching for GHCR.
      - name: Build image
        run: docker build -f deploy/Dockerfile -t ghcr.io/spotdl/spotify-downloader:edge .
      - name: Boot self-host stack
        env:
          SPOTDL_AUTH_SECRET_KEY: ci-smoke-secret-not-for-production
        run: docker compose -f deploy/docker-compose.selfhost.yml up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              echo "healthy"
              exit 0
            fi
            echo "waiting for health ($i)..."
            sleep 2
          done
          echo "service did not become healthy" >&2
          docker compose -f deploy/docker-compose.selfhost.yml logs
          exit 1
      - name: Assert metrics endpoint
        run: curl -fsS http://localhost:8000/metrics | grep spotdl_http_requests_total
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.selfhost.yml down -v
