name: Tests (Pytest)

on:
  push:
  pull_request:
  schedule:
    # Weekly run against the real services, to catch upstream API changes
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    # Offline: HTTP is replayed from VCR cassettes and Spotify calls from
    # *.spotify.json files, any other network access fails the test.
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv sync

      - name: Run tests
        timeout-minutes: 10
        run: |
          uv run pytest -vvv -m "not live" --record-mode=none --block-network
        env:
          PLATFORM: ${{ matrix.platform }}

  live:
    # Talks to Spotify, YouTube etc. for real. These services rate limit and
    # bot-check CI runners, so this job is informational only.
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python "3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv sync

      - uses: FedericoCarboni/setup-ffmpeg@v2
        id: setup-ffmpeg
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        timeout-minutes: 120
        run: |
          uv run pytest -vvv --disable-recording --ignore tests/test_matching.py

  matching:
    # Live like the `live` job, so it can be bot-checked too: report, don't block.
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    runs-on: "ubuntu-latest"
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python "3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv sync

      - name: Run tests
        timeout-minutes: 10
        run: |
          uv run pytest -vvv --record-mode=none --disable-recording tests/test_matching.py
