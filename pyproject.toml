[project]
name = "spotdl-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/server", "apps/cli"]

[tool.uv.sources]
spotdl-core = { workspace = true }
spotdl-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.14",
    "ruff>=0.9",
    "import-linter>=2.1",
    "httpx>=0.28",
    "respx>=0.22",
    "types-python-slugify>=8.0.2.20240310,<9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"

# mutagen ships ``py.typed`` but leaves most of its frame/atom constructors and
# I/O methods unannotated, which trips ``disallow_untyped_calls`` under strict.
# Skipping its imports makes the tag-embedding layer (spotdl_core.download.tags)
# type-check against ``Any``, matching how the untyped yt-dlp seam is handled.
[[tool.mypy.overrides]]
module = "mutagen.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not network'"
pythonpath = ["."]
testpaths = [
    "packages/core/tests",
    "apps/server/tests",
    "apps/cli/tests",
    "scripts/corpus/tests",
]
markers = [
    "network: test hits a real provider API over the network; excluded from default runs and CI",
]
