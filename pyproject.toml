[project]
name = "spotdl-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/server", "apps/cli"]

[tool.uv.sources]
spotdl-core = { workspace = true }
spotdl-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.14",
    "ruff>=0.9",
    "import-linter>=2.1",
    "httpx>=0.28",
    "respx>=0.22",
    "types-python-slugify>=8.0.2.20240310,<9",
    # Client-generation toolchain (Plan 8 Task 1, `make clients`). Pinned so the
    # checked-in generated client (apps/cli/.../_generated) is byte-stable; the
    # in-sync test regenerates with these exact versions and byte-compares.
    "openapi-python-client==0.24.*",
    "datamodel-code-generator>=0.28",
]
# Docs site toolchain (Plan 11 Task 7). mkdocs-material renders the site;
# mkdocs-gen-files runs the pinned generators (migration guide + OpenAPI copy)
# at build time; mkdocs-swagger-ui-tag renders the API reference from the
# copied openapi.json with no runtime CDN fetch (self-contained bundle).
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-gen-files>=0.5",
    "mkdocs-swagger-ui-tag>=0.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic scaffold + autogenerated migrations are framework-managed generated
# code (long enum CHECK lines, template-driven import order) — excluded from the
# linter/formatter so autogenerate output never has to fight ruff. The
# ``_generated`` CLI client (Plan 8 Task 1) is codegen output validated by the
# in-sync test + the generator's own ``ruff format`` post-processing, not our
# ``(E,F,I,UP,B,SIM)`` bar; it stays in the import-linter graph so a stray
# ``spotdl_core`` import there still trips ``no_cli_core``.
extend-exclude = [
    "apps/server/alembic",
    "apps/cli/src/spotdl_cli/_generated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom puts ``Depends(...)`` in parameter
# defaults; B008 (no function calls in argument defaults) is the framework's
# intended usage in the api layer (dependency providers + routers).
"apps/server/src/spotdl_server/api/**" = ["B008"]
# Typer's option/argument idiom puts ``typer.Option(...)`` / ``typer.Argument(...)``
# in parameter defaults — the framework's intended usage in the CLI commands.
"apps/cli/src/spotdl_cli/commands/**" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.13"
# The ``_generated`` CLI client (Plan 8 Task 1) is generator output that will not
# pass ``--strict`` and would churn on every regen; it is validated by the
# in-sync test instead. Excluded from type-checking (the hand-written façade over
# it is fully held to standards).
exclude = ["apps/cli/src/spotdl_cli/_generated/"]

# mutagen ships ``py.typed`` but leaves most of its frame/atom constructors and
# I/O methods unannotated, which trips ``disallow_untyped_calls`` under strict.
# Skipping its imports makes the tag-embedding layer (spotdl_core.download.tags)
# type-check against ``Any``, matching how the untyped yt-dlp seam is handled.
[[tool.mypy.overrides]]
module = "mutagen.*"
follow_imports = "skip"
ignore_missing_imports = true

# ``syncedlyrics`` is an optional runtime extra (the ``lrc`` group) and is not
# installed in the default/CI environment, so it has no importable stub. It is
# lazily imported behind the SyncedLyricsSearch seam; ignoring its imports keeps
# spotdl_core.download.post type-checkable whether or not the extra is present.
[[tool.mypy.overrides]]
module = "syncedlyrics.*"
follow_imports = "skip"
ignore_missing_imports = true

# ``redis`` is an optional runtime extra (apps/server's ``redis`` group) backing
# the alternate rate-limit backend, and is not installed in the default/CI
# environment, so it has no importable stub. It is lazily imported behind the
# RedisRateLimiter seam; ignoring its imports keeps spotdl_server.ratelimit.redis
# type-checkable whether or not the extra is present.
[[tool.mypy.overrides]]
module = "redis.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not network'"
pythonpath = ["."]
testpaths = [
    "packages/core/tests",
    "apps/server/tests",
    "apps/cli/tests",
    "scripts/corpus/tests",
    "scripts/docs/tests",
]
markers = [
    "network: test hits a real provider API over the network; excluded from default runs and CI",
    "postgres: test requires a Postgres server (SPOTDL_TEST_POSTGRES_URL); skipped locally, run in CI",
    "codegen: test spawns the client generators to verify the checked-in client is in sync",
]
