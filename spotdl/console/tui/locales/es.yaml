help:
  title: "Ayuda - Comandos"
  body: |-
    # Comandos de spotDL

    ## Operaciones
    | Comando | Descripcion |
    |---|---|
    | `spotdl download <consulta>` | Descarga canciones con metadatos completos (operacion por defecto) |
    | `spotdl sync <consulta>` | Sincroniza una carpeta local con una lista de Spotify |
    | `spotdl save <consulta>` | Guarda los metadatos de canciones en un archivo `.spotdl` |
    | `spotdl meta <archivos>` | Actualiza metadatos ID3/Vorbis de archivos locales |
    | `spotdl url <consulta>` | Muestra las URLs directas de descarga |
    | `spotdl web` | Inicia la interfaz web |
    | `spotdl interactive` | Inicia esta TUI |

    ## Desactivar la TUI
    `spotdl -nogui download <consulta>` (o `--no-gui`) ejecuta el CLI estandar
    sin arrancar la TUI.

    ## Flags comunes
    | Flag | Descripcion |
    |---|---|
    | `--format mp3/flac/m4a/opus/ogg/wav` | Formato de audio de salida |
    | `--bitrate auto/320k/192k/...` | Tasa de bits de conversion |
    | `--audio <proveedores...>` | Fuentes de audio en orden de respaldo |
    | `--lyrics <proveedores...>` | Fuentes de letras |
    | `--threads <n>` | Hilos paralelos de descarga |
    | `--output <plantilla>` | Plantilla de ruta de salida |
    | `--overwrite force/skip/metadata` | Comportamiento con archivos existentes |
    | `--user-auth` | Inicio de sesion OAuth de Spotify |
    | `--client-id / --client-secret` | Tus credenciales de desarrollador de Spotify |
    | `--save-file <archivo.spotdl>` | Archivo de estado (necesario para save/sync) |
    | `--m3u <nombre>` | Genera una lista m3u |
    | `--archive <archivo>` | Archivo de canciones ya descargadas |
    | `--generate-lrc` | Genera archivos `.lrc` sincronizados |
    | `--sponsor-block` | Elimina segmentos no musicales |
    | `--search-query <plantilla>` | Plantilla de busqueda personalizada |
    | `--dont-filter-results` | Desactiva el filtrado de resultados |
    | `--only-verified-results` | Acepta solo resultados verificados |
    | `--preload` | Precarga las URLs de descarga |
    | `--scan-for-songs` | Escanea la carpeta de salida |
    | `--fetch-albums` | Obtiene todos los albumes de la consulta |
    | `--simple-tui` | Progreso mas simple en el CLI |
    | `--log-level <nivel>` | Verbosidad del registro |
    | `--download-ffmpeg` | Instala FFmpeg en la carpeta de spotdl |
    | `--download-deno` | Instala Deno para descargas complejas |
    | `--check-for-updates` | Revisa si hay versiones nuevas |
    | `--generate-config` | Genera el `config.json` por defecto |
    | `--version` / `-v` | Muestra la version |

    ## Consultas especiales
    `saved`, `all-user-playlists`, `all-saved-playlists`,
    `all-user-followed-artists`, `all-user-saved-albums` (requieren `--user-auth`),
    mas busquedas con prefijo: `album:`, `artist:`, `playlist:`,
    y emparejamiento manual `YouTubeURL|SpotifyURL`.

    ## Variables de entorno
    `SPOTIPY_CLIENT_ID` / `SPOTIPY_CLIENT_SECRET`: credenciales propias de Spotify.
    `SPOTDL_LANG`: fuerza el idioma de la TUI ("es" o "en").

