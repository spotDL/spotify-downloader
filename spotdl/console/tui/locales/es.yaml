help:
  title: "Comandos CLI"
  guide_title: "Guía de la TUI"
  guide_tab: "Guía de la TUI"
  guide_body: |-
    # Guía de la Interfaz Interactiva de spotDL (TUI)

    Bienvenido a la interfaz terminal de spotDL. Esta guía detalla cada función, pantalla, ajuste y método de navegación disponible.

    ## Navegación y Controles

    spotDL está optimizado tanto para uso con ratón como mediante teclado:

    - **Barra Superior (AppBar)**:
      - **Ajustes**: Abre el panel de configuración global y personalización de preajustes.
      - **Menú**: Permite cambiar de idioma, atajos rápidos, instalación de dependencias y salir.
      - **Ayuda**: Abre esta guía detallada, la referencia de comandos y el constructor CLI.
      - **Salir**: Cierra spotDL al instante y regresa a la terminal.
    - **Paleta de Comandos (`Ctrl+P` o `/`)**:
      - Presiona `Ctrl+P` o `/` desde cualquier pantalla para abrir la búsqueda rápida.
      - Escribe cualquier acción o pantalla (ej. `descarga`, `historial`, `ajustes`, `aplicar preajuste`) para navegar de inmediato.
    - **Atajos Universales**:
      - `Esc`: Vuelve a la pantalla anterior (o sale desde el menú principal).
      - `Ctrl+Q`: Fuerza la salida limpia de la aplicación.
      - `Tab` / `Shift+Tab`: Cambia el foco entre campos, interruptores y botones.
      - `Espacio`: Marca/desmarca casillas y canciones en las listas.

    ## Pantallas y Operaciones

    - **Menú Principal**:
      - **+ Añadir Descarga**: Inicia una búsqueda o descarga de audio o listas.
      - **Actividad Reciente**: Muestra tu última descarga y permite volver a descargar con un clic.
      - **Tarjetas de Operación**: Acceso directo a Historial, Sincronización, Guardado, Ajustes, Constructor CLI, Metadatos, URLs directas y Web UI.
    - **Pantalla de Configuración de Descarga**:
      - **Consulta y Directorio**: Introduce un enlace de Spotify/YouTube o texto de búsqueda y elige la carpeta de destino.
      - **Preajustes (Presets)**: Elige entre perfiles de fábrica (`Ligero`, `Eficiente`, `Equilibrado`, `Estudio`) o tus propios preajustes personalizados.
      - **Control Detallado**: Ajusta formato de salida (MP3, FLAC, OPUS, etc.), tasa de bits, hilos de descarga concurrentes, proveedores de audio primario y secundario, letras y filtros.
    - **Selección de Pistas**:
      - Revisa las canciones encontradas antes de descargarlas.
      - Utiliza **Todas**, **Ninguna** o **Invertir** para selección masiva.
      - Pulsa `L` o el botón **Letras** para ver la letra sincronizada obtenida desde LRCLIB.
    - **Pantalla de Progreso de Descarga**:
      - Visualiza el progreso en tiempo real por cada pista y estadísticas globales.
      - Incluye visor de registro en vivo, botón **Copiar registro** y botón **Detener** para cancelar descargas pendientes sin corromper archivos en curso.

    ## Ajustes y Preajustes Personalizados

    - **General y Audio**: Configura el número predeterminado de hilos concurrentes, fuentes de audio preferidas, tasa de bits y precarga de enlaces.
    - **Salida y Archivos**: Elige carpetas por defecto, plantillas de nombres de archivo (`{artists} - {title}.{output-ext}`) y listas M3U automáticas.
    - **Filtros y Red**: Activa SponsorBlock (omite intros/outros), guardado de archivos `.lrc`, omisión de contenido explícito y nivel de verbosidad de logs.
    - **Gestor de Preajustes**: Crea, edita, guarda y elimina preajustes a medida para tus distintos dispositivos o preferencias de calidad.
  body: |-
    # Comandos de spotDL

    ## Operaciones
    | Comando | Descripción |
    |---|---|
    | `spotdl download <consulta>` | Descarga canciones con metadatos completos (operación por defecto) |
    | `spotdl sync <consulta>` | Sincroniza una carpeta local con una lista de Spotify |
    | `spotdl save <consulta>` | Guarda los metadatos de las canciones en un archivo `.spotdl` |
    | `spotdl meta <archivos>` | Actualiza los metadatos ID3/Vorbis de archivos locales |
    | `spotdl url <consulta>` | Muestra las URLs directas de descarga |
    | `spotdl web` | Inicia la interfaz web |
    | `spotdl interactive` | Inicia esta TUI |

    ## Desactivar la TUI
    `spotdl -nogui download <consulta>` (o `--no-gui`) ejecuta el CLI estándar
    sin abrir la TUI.

    ## Opciones comunes
    | Opción | Descripción |
    |---|---|
    | `--format mp3/flac/m4a/opus/ogg/wav` | Formato de audio de salida |
    | `--bitrate auto/320k/192k/...` | Tasa de bits de la conversión |
    | `--audio <proveedores...>` | Fuentes de audio en orden de respaldo |
    | `--lyrics <proveedores...>` | Fuentes de letras |
    | `--threads <n>` | Hilos de descarga en paralelo |
    | `--output <plantilla>` | Plantilla de la ruta de salida |
    | `--overwrite force/skip/metadata` | Qué hacer con archivos existentes |
    | `--user-auth` | Inicio de sesión OAuth de Spotify |
    | `--client-id / --client-secret` | Tus credenciales de desarrollador de Spotify |
    | `--save-file <archivo.spotdl>` | Archivo de estado (necesario para save/sync) |
    | `--m3u <nombre>` | Genera una lista m3u |
    | `--archive <archivo>` | Archivo con las canciones ya descargadas |
    | `--generate-lrc` | Genera archivos `.lrc` sincronizados |
    | `--sponsor-block` | Elimina los segmentos no musicales |
    | `--search-query <plantilla>` | Plantilla de búsqueda personalizada |
    | `--dont-filter-results` | Desactiva el filtrado de resultados |
    | `--only-verified-results` | Acepta solo resultados verificados |
    | `--preload` | Precarga las URLs de descarga |
    | `--scan-for-songs` | Revisa la carpeta de salida |
    | `--fetch-albums` | Obtiene todos los álbumes de la consulta |
    | `--simple-tui` | Progreso más simple en el CLI |
    | `--log-level <nivel>` | Nivel de detalle del registro |
    | `--download-ffmpeg` | Instala FFmpeg en la carpeta de spotdl |
    | `--download-deno` | Instala Deno para descargas complejas |
    | `--check-for-updates` | Comprueba si hay versiones nuevas |
    | `--generate-config` | Genera el `config.json` por defecto |
    | `--version` / `-v` | Muestra la versión |

    ## Consultas especiales
    `saved`, `all-user-playlists`, `all-saved-playlists`,
    `all-user-followed-artists`, `all-user-saved-albums` (requieren `--user-auth`),
    además de búsquedas con prefijo: `album:`, `artist:`, `playlist:`,
    y emparejamiento manual `YouTubeURL|SpotifyURL`.

    ## Variables de entorno
    `SPOTIPY_CLIENT_ID` / `SPOTIPY_CLIENT_SECRET`: credenciales propias de Spotify.
    `SPOTDL_LANG`: fuerza el idioma de la TUI ("es" o "en").

