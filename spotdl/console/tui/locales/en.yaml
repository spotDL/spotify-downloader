help:
  title: "CLI commands"
  guide_title: "TUI Guide"
  guide_tab: "TUI Guide"
  guide_body: |-
    # spotDL Interactive Interface Guide

    Welcome to the spotDL Terminal User Interface (TUI). This guide explains every feature, screen, setting, and navigation method available in the application.

    ## Navigation & Controls

    spotDL is designed to be fully usable with both the mouse and the keyboard:

    - **Top Bar (AppBar)**:
      - **Settings**: Open the global settings and preset management panel.
      - **Menu**: Access language switching, quick actions, setup, and quitting.
      - **Help**: Open this guide, the CLI reference, and the command builder.
      - **Exit**: Immediately quit spotDL and return to the terminal.
    - **Command Palette (`Ctrl+P` or `/`)**:
      - Press `Ctrl+P` or `/` from any screen to open the fuzzy search palette.
      - Type any screen name (e.g., `download`, `history`, `settings`) or action (`apply preset`, `switch language`) to jump directly.
    - **Global Shortcuts**:
      - `Esc`: Return to the previous screen (or exit from the home screen).
      - `Ctrl+Q`: Force exit the application.
      - `Tab` / `Shift+Tab`: Move focus between interactive fields and buttons.
      - `Space`: Toggle checkboxes and track selections.

    ## Screens & Operations

    - **Home Screen**:
      - **+ Add Download**: Start a new search or download.
      - **Recent Activity**: Shows your most recent download and allows quick re-downloading.
      - **Operation Cards**: Direct access to History, Sync, Save, Settings, CLI Builder, Metadata, Direct URLs, and Web UI.
    - **Download Query Screen**:
      - **Query & Directory**: Enter a song/album/playlist URL or search query, and pick your target destination folder.
      - **Presets**: Choose from built-in templates (`Light`, `Efficient`, `Balanced`, `Studio`) or custom user-defined presets.
      - **Granular Controls**: Configure audio format (MP3, FLAC, OPUS, etc.), bitrate, threads, primary and fallback audio providers, lyrics fetching, filename templates, and SponsorBlock.
    - **Track Selection Screen**:
      - Pick which songs to download before starting.
      - Use **All**, **None**, or **Invert** for fast bulk selection.
      - Press `L` or click **Lyrics** on any track to preview its synchronized lyrics.
    - **Download Progress Screen**:
      - Displays real-time progress per track and overall batch statistics.
      - Includes a live log viewer, **Copy log** button, and **Stop** button to cancel pending tracks cleanly.

    ## Settings & Custom Presets

    - **General & Audio**: Adjust default thread counts, preferred audio sources, default bitrates, and preload toggles.
    - **Output & File Naming**: Customize default download locations, filename templates (`{artists} - {title}.{output-ext}`), and M3U playlist generation.
    - **Filters & Network**: Enable or disable SponsorBlock, synchronized `.lrc` generation, explicit song skipping, and logging verbosity.
    - **Presets Manager**: Create, modify, save, or delete custom presets to tailor download configurations for different devices or audio setups.
  body: |-
    # spotDL commands

    ## Operations
    | Command | Description |
    |---|---|
    | `spotdl download <query>` | Download songs with full metadata (default operation) |
    | `spotdl sync <query>` | Sync a local folder with a Spotify list |
    | `spotdl save <query>` | Save song metadata to a `.spotdl` file |
    | `spotdl meta <files>` | Update ID3/Vorbis metadata of local audio files |
    | `spotdl url <query>` | Print the direct download URLs |
    | `spotdl web` | Start the web interface |
    | `spotdl interactive` | Start this TUI |

    ## Disable the TUI
    `spotdl -nogui download <query>` (or `--no-gui`) runs the standard CLI
    without launching the TUI.

    ## Common flags
    | Flag | Description |
    |---|---|
    | `--format mp3/flac/m4a/opus/ogg/wav` | Output audio format |
    | `--bitrate auto/320k/192k/...` | Conversion bitrate |
    | `--audio <providers...>` | Audio sources in fallback order |
    | `--lyrics <providers...>` | Lyrics sources |
    | `--threads <n>` | Parallel download threads |
    | `--output <template>` | Output path template |
    | `--overwrite force/skip/metadata` | Existing file behavior |
    | `--user-auth` | Spotify OAuth login |
    | `--client-id / --client-secret` | Your Spotify developer credentials |
    | `--save-file <file.spotdl>` | State file (required for save/sync) |
    | `--m3u <name>` | Generate an m3u playlist |
    | `--archive <file>` | Archive of already downloaded songs |
    | `--generate-lrc` | Generate synced `.lrc` files |
    | `--sponsor-block` | Remove non-music segments |
    | `--search-query <template>` | Custom search query template |
    | `--dont-filter-results` | Disable result filtering |
    | `--only-verified-results` | Only accept verified results |
    | `--preload` | Preload download URLs |
    | `--scan-for-songs` | Scan the output folder |
    | `--fetch-albums` | Fetch all albums from the query |
    | `--simple-tui` | Simpler progress output in the CLI |
    | `--log-level <level>` | Logging verbosity |
    | `--download-ffmpeg` | Install FFmpeg into the spotdl folder |
    | `--download-deno` | Install Deno for complex downloads |
    | `--check-for-updates` | Check for newer versions |
    | `--generate-config` | Generate the default `config.json` |
    | `--version` / `-v` | Show the version |

    ## Special queries
    `saved`, `all-user-playlists`, `all-saved-playlists`,
    `all-user-followed-artists`, `all-user-saved-albums` (require `--user-auth`),
    plus prefixed searches: `album:`, `artist:`, `playlist:`,
    and manual matching `YouTubeURL|SpotifyURL`.

    ## Environment
    `SPOTIPY_CLIENT_ID` / `SPOTIPY_CLIENT_SECRET`: custom Spotify credentials.
    `SPOTDL_LANG`: force the TUI language ("es" or "en").

