help:
  title: "Help - CLI commands"
  body: |-
    # spotDL commands

    ## Operations
    | Command | Description |
    |---|---|
    | `spotdl download <query>` | Download songs with full metadata (default operation) |
    | `spotdl sync <query>` | Sync a local folder with a Spotify list |
    | `spotdl save <query>` | Save song metadata to a `.spotdl` file |
    | `spotdl meta <files>` | Update ID3/Vorbis metadata of local audio files |
    | `spotdl url <query>` | Print the direct download URLs |
    | `spotdl web` | Start the web interface |
    | `spotdl interactive` | Start this TUI |

    ## Disable the TUI
    `spotdl -nogui download <query>` (or `--no-gui`) runs the standard CLI
    without launching the TUI.

    ## Common flags
    | Flag | Description |
    |---|---|
    | `--format mp3/flac/m4a/opus/ogg/wav` | Output audio format |
    | `--bitrate auto/320k/192k/...` | Conversion bitrate |
    | `--audio <providers...>` | Audio sources in fallback order |
    | `--lyrics <providers...>` | Lyrics sources |
    | `--threads <n>` | Parallel download threads |
    | `--output <template>` | Output path template |
    | `--overwrite force/skip/metadata` | Existing file behavior |
    | `--user-auth` | Spotify OAuth login |
    | `--client-id / --client-secret` | Your Spotify developer credentials |
    | `--save-file <file.spotdl>` | State file (required for save/sync) |
    | `--m3u <name>` | Generate an m3u playlist |
    | `--archive <file>` | Archive of already downloaded songs |
    | `--generate-lrc` | Generate synced `.lrc` files |
    | `--sponsor-block` | Remove non-music segments |
    | `--search-query <template>` | Custom search query template |
    | `--dont-filter-results` | Disable result filtering |
    | `--only-verified-results` | Only accept verified results |
    | `--preload` | Preload download URLs |
    | `--scan-for-songs` | Scan the output folder |
    | `--fetch-albums` | Fetch all albums from the query |
    | `--simple-tui` | Simpler progress output in the CLI |
    | `--log-level <level>` | Logging verbosity |
    | `--download-ffmpeg` | Install FFmpeg into the spotdl folder |
    | `--download-deno` | Install Deno for complex downloads |
    | `--check-for-updates` | Check for newer versions |
    | `--generate-config` | Generate the default `config.json` |
    | `--version` / `-v` | Show the version |

    ## Special queries
    `saved`, `all-user-playlists`, `all-saved-playlists`,
    `all-user-followed-artists`, `all-user-saved-albums` (require `--user-auth`),
    plus prefixed searches: `album:`, `artist:`, `playlist:`,
    and manual matching `YouTubeURL|SpotifyURL`.

    ## Environment
    `SPOTIPY_CLIENT_ID` / `SPOTIPY_CLIENT_SECRET`: custom Spotify credentials.
    `SPOTDL_LANG`: force the TUI language ("es" or "en").

