[project]
name = "spotdl"
version = "5.0.0a0"
description = "spotDL command-line interface"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["spotdl-server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_cli"]
