[project]
name = "spotdl"
version = "5.0.0a1"
description = "spotDL command-line interface"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.9,<3",
    "spotdl-server==5.0.0a1",
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "httpx-ws>=0.7",
    "platformdirs>=4.3",
    "tomlkit>=0.13",
    "uvicorn>=0.34",
    # Runtime deps of the checked-in generated client (Plan 8 Task 1, CONTRACT A:
    # "the generated code imports only httpx/attrs/pydantic"). openapi-python-client
    # emits attrs-based models and parses date-times with python-dateutil.
    "attrs>=24.1",
    "python-dateutil>=2.9",
]

[project.scripts]
spotdl = "spotdl_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_cli"]
