[project]
name = "spotdl"
version = "5.0.0a1"
description = "spotDL command-line interface"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "spotdl-server==5.0.0a1",
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
]

[project.scripts]
spotdl = "spotdl_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_cli"]
