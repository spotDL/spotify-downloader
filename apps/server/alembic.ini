# Alembic config for spotdl-server.
#
# No hardcoded `sqlalchemy.url`: env.py resolves the async URL from
# `Settings().effective_database_url()`, overridable by `-x db_url=...` (CLI) or
# the `db_url` config attribute (programmatic: bootstrap.upgrade_to_head).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Logging is intentionally minimal; the server owns application logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
