[project]
name = "spotdl-server"
version = "5.0.0a0"
description = "spotDL server"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "spotdl-core",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_server"]
