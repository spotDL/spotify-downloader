[project]
name = "spotdl-server"
version = "5.0.0a0"
description = "spotDL server"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "spotdl-core",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotdl_server"]

# Ship the Alembic scripts inside the wheel, force-included under the package so
# bootstrap.upgrade_to_head() can locate alembic.ini/scripts relative to the
# installed spotdl_server package (never the CWD) from a wheel install.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "spotdl_server/alembic"
"alembic.ini" = "spotdl_server/alembic.ini"
