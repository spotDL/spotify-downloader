        of music you haven't heard before!\\r\\n\\r\\nFeatures Cat! In STEREO!\\r\\n\\r\\nFeatures
        CD quality music! No more extremely low bitrate youtube videos of the soundtrack!\\r\\n\\r\\nFeatures
        a high quality image of the album cover!\",\"copyrightNotice\":\"All Rights
        Reserved\",\"comment\":[{\"@type\":\"Comment\",\"author\":{\"@type\":\"Person\",\"url\":\"https://bandcamp.com/lycere_the_kobold\",\"image\":\"https://f4.bcbits.com/img/0043326540_50.jpg\",\"additionalProperty\":[{\"@type\":\"PropertyValue\",\"name\":\"image_id\",\"value\":43326540}],\"name\":\"Lycere
        the Kobold\"},\"text\":[\"It's the music that went along with a time mostly
        gone. Nostalgic, still nice to listen to even after all these years.\",\"Favorite
        track: Sweden\"]},{\"@type\":\"Comment\",\"author\":{\"@type\":\"Person\",\"url\":\"https://bandcamp.com/44nifty\",\"image\":\"https://f4.bcbits.com/img/0041952479_50.jpg\",\"additionalProperty\":[{\"@type\":\"PropertyValue\",\"name\":\"image_id\",\"value\":41952479}],\"name\":\"44nifty\"},\"text\":[\"C418's
        Minecraft is one of the few video game soundtracks I think can hold its own
        as an independent album. Volume Alpha has long been a comfort album of mine,
        providing background noise for studying and sleep aid on restless nights.\",\"Favorite
        track: Moog City\"]},{\"@type\":\"Comment\",\"author\":{\"@type\":\"Person\",\"url\":\"https://bandcamp.com/banjothebirb\",\"image\":\"https://f4.bcbits.com/img/0041681095_50.jpg\",\"additionalProperty\":[{\"@type\":\"PropertyValue\",\"name\":\"image_id\",\"value\":41681095}],\"name\":\"Lachlan
        Paul\"},\"text\":[\"cant listen to this without tearing up a bit. this game
        means so much to me\",\"Favorite track: Haggstrom\"]},{\"@type\":\"Comment\",\"author\":{\"@type\":\"Person\",\"url\":\"https://bandcamp.com/ale_benels\",\"image\":\"https://f4.bcbits.com/img/0042617016_50.jpg\",\"additionalProperty\":[{\"@type\":\"PropertyValue\",\"name\":\"image_id\",\"value\":42617016}],\"name\":\"ale_benels\"},\"text\":[\"Me
        recuerda a cuando era ni\xF1o y escond\xEDa mi tel\xE9fono en mis almohadas
        para poder jugar en la noche con mis amigos, mientras todos dorm\xEDan \",\"Favorite
        track: Moog City\"]},{\"@type\":\"Comment\",\"author\":{\"@type\":\"Person\",\"url\":\"https://bandcamp.com/joujou_tdj\",\"image\":\"https://f4.bcbits.com/img/0042811951_50.jpg\",\"additionalProperty\":[{\"@type\":\"PropertyValue\",\"name\":\"image_id\",\"value\":42811951}],\"name\":\"jou\"},\"text\":[\"It
        makes life feel cubic, which is nice.\",\"Favorite track: Haggstrom\"]},{\"@type\":\"Comment\",\"author\":{\"@type\":\"Person\",\"url\":\"https://bandcamp.com/ghostfiish\",\"image\":\"https://f4.bcbits.com/img/0011691701_50.jpg\",\"additionalProperty\":[{\"@type\":\"PropertyValue\",\"name\":\"image_id\",\"value\":11691701}],\"name\":\"ghostfiish\"},\"text\":[\"Hours
        and hours and hours sunk into this game, and part of it is the unbeatable
        music. I'm glad I can take it with me to work and other areas of my life,
        even if I don't have as much time to play anymore.\",\"Favorite track: Mice
