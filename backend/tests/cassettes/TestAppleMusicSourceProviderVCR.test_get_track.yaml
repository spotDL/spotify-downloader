        Punk\u2004\xB7\u20042001\",\"paragraphText\":\"\\u003Cb>100 Best Albums\\u003C/b>
        There\u2019s a video that Daft Punk made to promote 2001\u2019s \\u003Ci>Discovery\\u003C/i>
        in which the French duo, wearing their famous robot helmets, dance on the
        Tokyo subway. Some riders smile and stare, while others look politely away.
        At the time, Daft Punk was big enough business to dismiss goofing off\u2014their
        first album, 1997\u2019s \\u003Ci>Homework\\u003C/i>, had already sold two
        million copies. And yet, when asked about \\u003Ci>Discovery\\u003C/i>\u2019s
        turn toward \u201970s and \u201980s pop, Thomas Bangalter said the goal wasn\u2019t
        to evoke a specific sound or era, but the raw wonder they\u2019d felt encountering
        that music as children. Dancing on the subway in a city where they didn\u2019t
        speak the language, liberated from judgment and self-criticism: It\u2019s
        all there in the title.\\u003Cbr />\\nThe album\u2019s biggest singles\u2014\u201COne
        More Time,\u201D \u201CHarder Better Faster Stronger,\u201D \u201CDigital
        Love\u201D\u2014were as useful to wedding DJs as they were to pop philosophers.
        And the rest\u2014the faux-metal guitars of \u201CAerodynamic,\u201D the sci-fi
        daydream of \u201CVeridis Quo,\u201D the UK garage showcase of Todd Edwards
        on \u201CFace to Face\u201D\u2014glimpsed down dozens of stylistic alleyways
        without disrupting the album\u2019s course. \u201CElectronic music\u201D\u2014a
        term that always suggested the future, however vague\u2014was demonstrated
        to be as familiar and comforting as classic rock, and no less real in its
        depth of feeling.\\u003Cbr />\\nYou can easily trace \\u003Ci>Discovery\\u003C/i>
        forward to EDM and the continuing entwinement of techno and rock. But you
        can also trace it back to The Beatles circa \\u003Ci>Sgt. Pepper\u2019s Lonely
        Hearts Club Band\\u003C/i> or The Beach Boys circa \\u003Ci>Pet Sounds\\u003C/i>
        and \\u003Ci>Smile\\u003C/i>: music that took pop seriously as art, but also
        recontextualized older, seemingly uncool styles in ways that felt progressive
        and fresh. Most of all, though, Daft Punk wanted to be universal. And as implausible
        as it may have seemed for two French men in robot helmets, \\u003Ci>Discovery\\u003C/i>
        got them there. \u201CWe hope all the kids will love the video,\u201D a disembodied
        voice says near the end of the promo clip. \u201CAs well as their parents.\u201D\"},\"showExplicitBadge\":false,\"audioBadges\":{\"dolbyAtmos\":false,\"dolbyAudio\":false,\"lossless\":true,\"hiResLossless\":false,\"digitalMaster\":false},\"contentDescriptor\":{\"kind\":\"album\",\"identifiers\":{\"storeAdamID\":\"697194953\"},\"url\":\"https://music.apple.com/us/album/discovery/697194953\"},\"playButton\":{\"id\":\"play-button-non-subscriber-697194953\",\"segue\":{\"$kind\":\"playAction\",\"actionMetrics\":{\"data\":[{\"fields\":{\"actionType\":\"play\",\"actionDetails\":{\"kind\":\"album\"},\"actionUrl\":\"https://music.apple.com/us/album/discovery/697194953\",\"eventType\":\"click\",\"targetType\":\"button\",\"targetId\":\"697194953\",\"eventVersion\":5},\"includingFields\":[\"pageFields\",\"impressionsSnapshot\",\"languages\",\"clickLocation\"],\"excludingFields\":[],\"topic\":\"xp_its_music_main\",\"shouldFlush\":false}],\"custom\":{}},\"items\":[{\"contentDescriptor\":{\"kind\":\"album\",\"identifiers\":{\"storeAdamID\":\"697194953\"},\"url\":\"https://music.apple.com/us/album/discovery/697194953\"}}],\"containerContentDescriptor\":{\"kind\":\"album\",\"identifiers\":{\"storeAdamID\":\"697194953\"},\"url\":\"https://music.apple.com/us/album/discovery/697194953\"},\"groupingIdentifier\":null},\"title\":\"Preview\",\"impressionMetrics\":{\"id\":{\"parentId\":\"1201520335\",\"id\":\"932545890\",\"impressionIndex\":1},\"fields\":{\"impressionId\":932545890,\"id\":\"697194953\",\"impressionIndex\":1,\"impressionParentId\":1201520335,\"name\":\"Preview\",\"impressionType\":\"button\",\"kind\":\"album\"},\"clickLocationFields\":{\"id\":\"697194953\",\"locationPosition\":1,\"name\":\"Preview\",\"locationType\":\"button\",\"kind\":\"album\"},\"custom\":{}}},\"shuffleButton\":null,\"videoArtwork\":null,\"trackCount\":14,\"siriBannerConfiguration\":null,\"isPreviewMode\":true,\"offers\":[{\"buyParams\":\"productType=P&price=9990&salableAdamId=697194953&pricingPara