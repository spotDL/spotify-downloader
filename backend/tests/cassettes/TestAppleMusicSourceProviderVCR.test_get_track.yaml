        svelte-1ji3yu5\" style=\"--lines: 3; --line-height: var(--lineHeight, 16);
        --link-length: 4;\"><!-- HTML_TAG_START --><b>100 Best Albums</b> There\u2019s
        a video that Daft Punk made to promote 2001\u2019s <i>Discovery</i> in which
        the French duo, wearing their famous robot helmets, dance on the Tokyo subway.
        Some riders smile and stare, while others look politely away. At the time,
        Daft Punk was big enough business to dismiss goofing off\u2014their first
        album, 1997\u2019s <i>Homework</i>, had already sold two million copies. And
        yet, when asked about <i>Discovery</i>\u2019s turn toward \u201970s and \u201980s
        pop, Thomas Bangalter said the goal wasn\u2019t to evoke a specific sound
        or era, but the raw wonder they\u2019d felt encountering that music as children.
        Dancing on the subway in a city where they didn\u2019t speak the language,
        liberated from judgment and self-criticism: It\u2019s all there in the title.<br>\nThe
        album\u2019s biggest singles\u2014\u201COne More Time,\u201D \u201CHarder
        Better Faster Stronger,\u201D \u201CDigital Love\u201D\u2014were as useful
        to wedding DJs as they were to pop philosophers. And the rest\u2014the faux-metal
        guitars of \u201CAerodynamic,\u201D the sci-fi daydream of \u201CVeridis Quo,\u201D
        the UK garage showcase of Todd Edwards on \u201CFace to Face\u201D\u2014glimpsed
        down dozens of stylistic alleyways without disrupting the album\u2019s course.
        \u201CElectronic music\u201D\u2014a term that always suggested the future,
        however vague\u2014was demonstrated to be as familiar and comforting as classic
        rock, and no less real in its depth of feeling.<br>\nYou can easily trace
        <i>Discovery</i> forward to EDM and the continuing entwinement of techno and
        rock. But you can also trace it back to The Beatles circa <i>Sgt. Pepper\u2019s
        Lonely Hearts Club Band</i> or The Beach Boys circa <i>Pet Sounds</i> and
        <i>Smile</i>: music that took pop seriously as art, but also recontextualized
        older, seemingly uncool styles in ways that felt progressive and fresh. Most
        of all, though, Daft Punk wanted to be universal. And as implausible as it
        may have seemed for two French men in robot helmets, <i>Discovery</i> got
        them there. \u201CWe hope all the kids will love the video,\u201D a disembodied
        voice says near the end of the promo clip. \u201CAs well as their parents.\u201D<!--
